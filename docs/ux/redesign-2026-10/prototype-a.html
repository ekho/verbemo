 case 'clear-global':s.query='';s.filter='all';render('global-search');return;
 case 'meeting':{const q=s.query;UX70.select(s,el.dataset.id,s.query.trim()?'current':undefined);if($('app').clientWidth<=900)s.list=false;render('meeting-title');if(el.dataset.source)jump({source:el.dataset.source,index:Number(el.dataset.index)});s.query=q;return;}
 case 'tab':UX70.view(s).tab=el.dataset.tab;render('tab-'+el.dataset.tab);return;
 case 'find':beginFind();return;
 case 'close-find':endFind();return;
 case 'next-hit':{const hits=UX70.search(s,s.localQuery,true);jump(hits[s.hit++%hits.length]);return;}
 case 'edit':editSpeaker(el.dataset.speaker);return;
 case 'cancel-dialog':closeDialog();return;
 case 'unlink':$('person-choice').value='';$('person-name').value='';$('person-name').focus();return;
 case 'details':s.details=!s.details;render(s.details?'close-details':'details-button');return;
 case 'settings':s.returnPage=s.page;s.page='settings';s.categoryOpen=false;render('back-settings');return;
 case 'back-settings':s.page='meeting';render('settings-button');return;
 case 'category':s.category=el.dataset.category;s.categoryOpen=true;render('settings-title');return;
 case 'categories':s.categoryOpen=false;render();return;
 case 'play':s.playing=!s.playing;render('play-button');return;
 case 'seek':s.time=Number(el.dataset.time);s.playing=true;render();return;
 case 'open-current':UX70.select(s,s.selected,'current');render('meeting-title');return;
 case 'summary':start('summary');return;
 case 'transcribe':start('transcript');return;
 case 'retry-job':start(s.job.kind);return;
 case 'job-view':UX70.select(s,s.job.meeting);s.list=false;s.details=true;render('close-details');return;
 case 'job-success':UX70.finishJob(s,'done');announce(T('Демонстрационное задание завершено.','Simulated job completed.'));render();return;
 case 'job-error':UX70.finishJob(s,'error');announce(T('Демонстрационная ошибка. Предыдущий результат сохранён.','Simulated error. Previous result preserved.'));render();return;
 case 'cancel-job':if(UX70.active(s.job)){s.job.status='cancelling';render();clearTimeout(jobTimer);jobTimer=setTimeout(()=>{UX70.finishJob(s,'cancelled');announce(T('Обработка отменена. Готовые результаты сохранены.','Processing cancelled. Completed results preserved.'));render();},700);}return;
 case 'record':dialog('<h2 id="editor-title">'+T('Новая учебная запись','New demo recording')+'</h2><p>'+T('Микрофон не включится. Проверяем навигацию во время записи.','The microphone stays off. This tests navigation during recording.')+'</p><label for="record-title">'+T('Название','Title')+'</label><input id="record-title" value="'+T('Учебная запись','Demo recording')+'"><div class="row actions">'+B('cancel-dialog',T('Отмена','Cancel'))+'<button class="primary" type="submit">'+T('Начать демонстрацию','Start simulation')+'</button></div>',()=>{const title=$('record-title').value.trim()||T('Учебная запись','Demo recording');closeDialog();const id=addMeeting(title,true);s.recording={id,paused:false,seconds:0};render();});return;
 case 'pause-record':s.recording.paused=!s.recording.paused;render();return;
 case 'recording-view':UX70.select(s,s.recording.id);s.list=false;render();return;
 case 'stop-record':{const id=s.recording.id;s.recording=null;const m=s.meetings.find(m=>m.id===id);m.status='deferred';announce(T('Учебная запись завершена и ожидает обработки.','Demo recording stopped and waiting for processing.'));render();return;}
 case 'import':dialog('<h2 id="editor-title">'+T('Демонстрация импорта','Import simulation')+'</h2><p>'+T('Добавим вымышленную встречу. Файлы компьютера не читаются.','Adds a fictional meeting. No computer files are read.')+'</p><div class="row actions">'+B('cancel-dialog',T('Отмена','Cancel'))+'<button type="submit">'+T('Добавить учебный файл','Add sample file')+'</button></div>',()=>{closeDialog();addMeeting(T('Импорт — учебный файл','Import — sample file'));render();});return;
 case 'rename':dialog('<h2 id="editor-title">'+T('Переименовать встречу','Rename meeting')+'</h2><label for="new-title">'+T('Название','Title')+'</label><input id="new-title" maxlength="160" required value="'+E(UX70.current(s).title)+'"><div class="row actions">'+B('cancel-dialog',T('Отмена','Cancel'))+'<button type="submit">'+T('Сохранить','Save')+'</button></div>',()=>{const title=$('new-title').value.trim();if(!title)return;UX70.current(s).title=title;closeDialog();render();});return;
 case 'delete':dialog('<h2 id="editor-title">'+T('Удалить учебную встречу?','Delete sample meeting?')+'</h2><p>'+T('Встреча и все её версии исчезнут только из макета. В течение 10 секунд доступно восстановление. Сброс макета возвращает весь набор.','The meeting and all its versions disappear from this prototype only. Undo is available for 10 seconds. Reset restores all samples.')+'</p><div class="row actions">'+B('cancel-dialog',T('Отмена','Cancel'))+'<button type="submit">'+T('Удалить','Delete')+'</button></div>',()=>{closeDialog();if(UX70.remove(s)){announce(T('Учебная встреча удалена. Можно восстановить в течение 10 секунд.','Sample meeting deleted. Undo within 10 seconds.'));clearTimeout(undoTimer);undoTimer=setTimeout(()=>{s.deleted=null;render();},10000);}render();});return;
 case 'undo':UX70.undo(s);clearTimeout(undoTimer);announce(T('Учебная встреча восстановлена.','Sample meeting restored.'));render();return;
 case 'dismiss':s.message='';render();return;
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='global-search'){saveScroll();s.query=e.target.value;render('global-search');}
 if(e.target.id==='local-search'){saveScroll();s.localQuery=e.target.value;s.hit=0;render('local-search');}
 if(e.target.id==='seek'){s.time=Number(e.target.value);$('play-time').textContent=time(s.time)+' / '+time(UX70.current(s).duration);}
 if(e.target.id==='person-name')$('person-choice').value='';
});
document.addEventListener('change',e=>{
 const el=e.target;if(el.id==='person-choice'){$('person-name').value=UX70.current(s).people.find(p=>p.id===el.value)?.name||'';return;}
 if(el.id==='frame-size'){const dims=el.value.split(',');$('app').style.width=el.value==='auto'?'100%':dims[0]+'px';$('app').style.height=el.value==='auto'?'calc(100dvh - 90px)':dims[1]+'px';if(Number(dims[0])<=900)s.list=false;render();return;}
 if(el.id==='filter')s.filter=el.value;
 if(el.id==='version'){saveScroll();UX70.select(s,s.selected,el.value);}
 if(el.id==='speed')s.speed=Number(el.value);
 if(el.id==='demo-language'||el.dataset.setting==='language'){s.language=el.value;s.settings.language=el.value;}
 if(el.id==='demo-platform'){s.platform=el.value;if(s.platform==='win'&&s.category==='calendar')s.category='app';}
 if(el.dataset.setting)s.settings[el.dataset.setting]=el.value;
 render(el.id);
});
document.addEventListener('keydown',e=>{
 if($('editor').open)return;
 if((e.metaKey||e.ctrlKey)&&e.code==='KeyF'){e.preventDefault();saveScroll();if(s.page==='settings'||s.list&&$('app').clientWidth<=900){s.page='meeting';s.list=true;render('global-search');}else{beginFind();}}
 if((e.metaKey||e.ctrlKey)&&e.code==='Comma'){e.preventDefault();saveScroll();s.page='settings';render('back-settings');}
 if(e.key==='Escape'){if(s.details){s.details=false;render('details-button');}else if(s.find){endFind();}}
 if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();saveScroll();const tabs=['transcript','summary','participants'];const i=tabs.indexOf(UX70.view(s).tab);UX70.view(s).tab=tabs[(i+(e.key==='ArrowRight'?1:2))%3];render('tab-'+UX70.view(s).tab);}
});
$('editor').addEventListener('cancel',()=>{editorContext=null;});
$('demo-reset').onclick=()=>{clearTimeout(jobTimer);clearTimeout(undoTimer);if($('editor').open)closeDialog();s=UX70.createState(data);if($('app').clientWidth<=900)s.list=false;render();};
setInterval(()=>{
 if(s.recording&&!s.recording.paused)s.recording.seconds++;
 if(s.playing&&UX70.current(s)){s.time=Math.min(UX70.current(s).duration,s.time+s.speed);if(s.time>=UX70.current(s).duration)s.playing=false;}
 if($('record-time')&&s.recording)$('record-time').textContent=(s.recording.paused?T('Пауза','Paused'):T('Запись','Recording'))+' · '+time(s.recording.seconds);
 if($('play-time')&&UX70.current(s))$('play-time').textContent=time(s.time)+' / '+time(UX70.current(s).duration);
 if($('seek'))$('seek').value=s.time;
 if($('play-button'))$('play-button').textContent=s.playing?T('Пауза','Pause'):T('Слушать','Play');
},1000);
render();if($('app').clientWidth<=900){s.list=false;render();}
}
</script>
</body>
</html>
