name: Windows hook diagnostics
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Reproduce and identify directory handle owners
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'handle'
          Invoke-WebRequest https://download.sysinternals.com/files/Handle.zip -OutFile "$tools.zip"
          Expand-Archive "$tools.zip" $tools
          dotnet build windows/tests/Verbemo.Live.Tests/Verbemo.Live.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            Write-Output "Full-suite hook reproduction $attempt/10"
            dotnet test windows/tests/Verbemo.Live.Tests/Verbemo.Live.Tests.csproj -c Release --no-build --logger 'console;verbosity=detailed'
            if ($LASTEXITCODE -ne 0) {
              Get-CimInstance Win32_Process | Where-Object { $_.Name -in @('powershell.exe', 'conhost.exe', 'testhost.exe') } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
              & "$tools/handle64.exe" -accepteula -nobanner verbemo-hook-tests
              throw "Hook reproduction failed on attempt $attempt"
            }
          }
