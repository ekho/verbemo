name: Release cleanup

on:
  schedule:
    - cron: '17 3 * * 1' # Monday, 06:17 Europe/Moscow (03:17 UTC).
  workflow_dispatch:
    inputs:
      dry_run:
        description: List old releases without deleting them
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: verbemo-release
  cancel-in-progress: false
  queue: max

jobs:
  cleanup:
    if: github.repository == 'ekho/verbemo' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply retention or preview deletions
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          arguments=()
          if [ "$APPLY" = true ]; then arguments+=(--apply); fi
          python3 scripts/cleanup_releases.py "${arguments[@]}"
