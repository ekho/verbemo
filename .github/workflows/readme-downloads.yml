name: Published README downloads

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - README.md
      - scripts/download_metadata.py
      - scripts/update-readme-downloads.py
      - .github/workflows/readme-downloads.yml

permissions:
  contents: read

concurrency:
  group: published-readme-downloads
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Validate trusted default-branch policy, never execute release artifacts.
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - name: Verify README against the complete own public release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-readme-downloads.py --check --public
